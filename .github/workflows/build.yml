name: Build RoPorter
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Build
      run: msbuild Rbx2Source.sln /restore /p:Configuration=Release
    - name: Test GLB and glTF export
      run: dotnet test Tests\Rbx2Source.Tests.csproj --configuration Release
    - name: VirusTotal Scan
      continue-on-error: true
      uses: crazy-max/ghaction-virustotal@v3
      with:
        vt_api_key: ${{ secrets.VT_APIKEY}}
        request_rate: 4
        files: bin/Release/RoPorter.exe
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RoPorter
        path: bin/Release/RoPorter.exe
        if-no-files-found: error
